# GitHub's "Android CI" starter workflow, with two changes:
#   - JDK 17 rather than the template's 11, which AGP 8.x refuses to run on.
#   - Reports uploaded on failure, so a red run can be read without re-running it.
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: reports
        path: |
          app/build/reports/
          app/build/test-results/
        if-no-files-found: ignore
