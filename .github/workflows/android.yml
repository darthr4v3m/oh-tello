# GitHub's "Android CI" starter workflow, with these changes:
#   - JDK 17 rather than the template's 11, which AGP 8.x refuses to run on.
#   - The debug APK uploaded as an artifact, so a build can be sideloaded onto a
#     phone without a local Android SDK.
#   - Test builds published to a rolling prerelease and linked from their pull
#     request, because an artifact is a login-walled zip and a release asset is a
#     direct .apk URL you can tap on the phone.
#   - Tagged commits published as a real release. Pushing to main only builds and
#     tests; cutting a release is a deliberate act of pushing a v* tag, so a
#     release is a fixed thing rather than something every merge overwrites.
#   - Reports uploaded on failure, so a red run can be read without re-running it.
name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Builds an APK from any branch on demand, as an artifact. Deliberately does
  # not publish: an arbitrary branch has no release worth naming.
  workflow_dispatch:

# Pushes in quick succession overlap, and a slower older run finishing last
# leaves the release asset and the PR comment pointing at an older build than
# the branch actually has. Only the newest run for a ref is worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write        # publish the APK to a release
      pull-requests: write   # link it from the PR

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Names the build once, for the APK filename, the version stamped inside it,
    # and the PR comment, so all three agree.
    - name: Name this build
      id: name
      env:
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        version=$(sed -n 's/^val baseVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
        [ -n "$version" ] || { echo "could not read baseVersionName"; exit 1; }
        built_at=$(date -u +%Y%m%d-%H%MZ)

        if [ "$EVENT" = "pull_request" ]; then
          sha="${HEAD_SHA:0:7}"
          label="pr$PR_NUMBER-$sha"
          apk="oh-tello-pr$PR_NUMBER-$built_at-$sha-debug.apk"
        elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
          # A tagged release. The tag already pins the code, so the filename
          # needs no timestamp or commit, and the version needs no suffix.
          label=""
          apk="oh-tello-$GITHUB_REF_NAME-debug.apk"
        else
          sha="${GITHUB_SHA:0:7}"
          label="v$version-$sha"
          apk="oh-tello-v$version-$built_at-$sha-debug.apk"
        fi

        {
          echo "label=$label"
          echo "apk=$apk"
          echo "built_at=$built_at"
        } >> "$GITHUB_OUTPUT"

    # Debug builds are signed with a shared key so they replace each other on a
    # device instead of needing an uninstall between them. It lives in a secret
    # rather than the repository; without it the build falls back to a
    # throwaway key, which still works but will not install over anything else.
    - name: Restore the debug signing key
      id: signing
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
          echo "::warning::DEBUG_KEYSTORE_BASE64 is not set — this build gets a throwaway debug key and will not install over other builds"
          echo "shared=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "shared=true" >> "$GITHUB_OUTPUT"
        printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
        # Fail loudly here rather than a minute later inside Gradle.
        keytool -list -keystore app/debug.keystore -storepass android >/dev/null

        # The build signs with the alias `androiddebugkey`, but a keystore is not
        # always made by keytool — Windows' Export-PfxCertificate, for one, names
        # the entry itself and ignores the friendly name — so rename whatever
        # single key is in there rather than demanding the key be made a
        # particular way.
        alias=$(keytool -list -keystore app/debug.keystore -storepass android \
          | awk -F, '/PrivateKeyEntry/{print $1; exit}')
        [ -n "$alias" ] || { echo "no private key in the keystore"; exit 1; }
        if [ "$alias" != "androiddebugkey" ]; then
          echo "renaming key alias '$alias' to androiddebugkey"
          keytool -changealias -keystore app/debug.keystore -storepass android \
            -keypass android -alias "$alias" -destalias androiddebugkey
        fi
        echo "shared debug key restored"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      env:
        # Ends up in versionName, so an installed build still knows what it is.
        # Empty for tagged releases, which carry the plain version.
        OH_TELLO_BUILD_LABEL: ${{ steps.name.outputs.label }}
      # `build` deliberately, not just the debug tasks: this also assembles,
      # dexes and lints the release variant. It costs about 40s and is the only
      # thing standing between a release-only problem — a proguard rule, a lint
      # check that only runs on release — and the day you cut a release.
      run: ./gradlew build

    - name: Rename the APK
      run: mv app/build/outputs/apk/debug/app-debug.apk "${{ steps.name.outputs.apk }}"

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: oh-tello-debug-apk
        path: ${{ steps.name.outputs.apk }}
        if-no-files-found: error

    # Pull requests and tags only. Pushes to main build and test but publish
    # nothing, so a release is never quietly replaced by the next merge.
    # Fork pull requests are skipped too: their tokens are read-only, so
    # publishing would fail the build rather than just not happening.
    - name: Publish the APK
      id: publish
      if: >-
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
        || startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        APK: ${{ steps.name.outputs.apk }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "pull_request" ]; then
          tag="pr-$PR_NUMBER"
          title="PR #$PR_NUMBER debug build"
          # The PR head, not the ephemeral merge commit: the tag has to point at
          # something that exists on the remote.
          target="$HEAD_SHA"
          rolling=1
          extra=(--prerelease)
          notes='Test build for this pull request, replaced on every push. Debug-signed,
        so it installs without a keystore and is not suitable for distribution.'
        else
          tag="$GITHUB_REF_NAME"
          title="Oh-Tello $GITHUB_REF_NAME"
          target="$GITHUB_SHA"
          rolling=0
          extra=(--latest)
          notes='Release build.

        Still debug-signed: the project has no release keystore yet, so this
        installs on a device but is not suitable for distribution.'
        fi

        gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 || \
          gh release create "$tag" --repo "$REPO" --target "$target" "${extra[@]}" \
            --title "$title" --notes "$notes"

        # For a pull request the filename carries a timestamp and commit, so each
        # build is a new asset rather than a replacement. Drop the previous ones:
        # the prerelease should hold the current build and nothing else, so there
        # is no way to install a stale APK by picking the wrong row. A tagged
        # release is fixed, and nothing is ever deleted from it.
        if [ "$rolling" = "1" ]; then
          stale=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep '\.apk$' | grep -v "^$APK$" || true)
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            # Tidying, not the job: the API 502s now and then, and the upload
            # below publishes the new build regardless. Worth a warning, not a
            # failed build.
            gh release delete-asset "$tag" "$asset" --repo "$REPO" --yes \
              || echo "::warning::could not delete stale asset $asset"
          done <<< "$stale"
        fi

        gh release upload "$tag" "$APK" --repo "$REPO" --clobber

        echo "url=https://github.com/$REPO/releases/download/$tag/$APK" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    # One comment, edited in place on later pushes, rather than a new one per build.
    - name: Link the APK from the pull request
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        APK_URL: ${{ steps.publish.outputs.url }}
        APK: ${{ steps.name.outputs.apk }}
        BUILT_AT: ${{ steps.name.outputs.built_at }}
        SHARED_KEY: ${{ steps.signing.outputs.shared }}
      run: |
        set -euo pipefail
        marker='<!-- oh-tello-apk -->'

        if [ "$SHARED_KEY" = "true" ]; then
          signing_note='Builds share a debug signing key, so this replaces any previous Oh-Tello
        build. If Android refuses to install it, the copy on the device predates
        that shared key — uninstall it once and later builds will replace each
        other cleanly.'
        else
          signing_note='**This build carries a throwaway signing key**, because the
        DEBUG_KEYSTORE_BASE64 secret is not set. It will not install over an existing
        Oh-Tello — uninstall that one first.'
        fi
        body=$(cat <<EOF
        $marker
        ### 📲 [$APK]($APK_URL)

        Built from \`${HEAD_SHA:0:7}\` at $BUILT_AT. Tap the link on the phone and
        Android will offer to install it — no zip to unpack, no sign-in.

        The same string is stamped into the app version, so once installed you can
        still tell which build it is: it shows under the title on the first screen,
        and in Settings > Apps > Oh-Tello. This comment and the release asset are
        both replaced as new commits are pushed.

        $signing_note

        ---
        _Generated by [Claude Code](https://claude.ai/code)_
        EOF
        )

        id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
          --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty" | head -n1)

        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
        fi

    - name: Upload reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: reports
        path: |
          app/build/reports/
          app/build/test-results/
        if-no-files-found: ignore
