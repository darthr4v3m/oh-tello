# GitHub's "Android CI" starter workflow, with four changes:
#   - JDK 17 rather than the template's 11, which AGP 8.x refuses to run on.
#   - The debug APK uploaded as an artifact, so a build can be sideloaded onto a
#     phone without a local Android SDK. Debug is signed with the standard debug
#     keystore, so it installs; the release variant is unsigned and will not.
#   - That same APK published to a prerelease and linked from the pull request,
#     because an artifact is a login-walled zip and a release asset is a direct
#     .apk URL you can tap on the phone.
#   - Reports uploaded on failure, so a red run can be read without re-running it.
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets you build an APK from any branch on demand, from the Actions tab.
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write        # publish the APK to a prerelease
      pull-requests: write   # link it from the PR

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Names the build once, for the APK filename, the version stamped inside it,
    # and the PR comment, so all three agree.
    - name: Name this build
      id: name
      env:
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        version=$(sed -n 's/^val baseVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
        [ -n "$version" ] || { echo "could not read baseVersionName"; exit 1; }

        if [ "$EVENT" = "pull_request" ]; then
          sha="${HEAD_SHA:0:7}"
          provenance="pr$PR_NUMBER"
        else
          sha="${GITHUB_SHA:0:7}"
          provenance="v$version"
        fi

        built_at=$(date -u +%Y%m%d-%H%MZ)
        {
          echo "label=$provenance-$sha"
          echo "apk=oh-tello-$provenance-$built_at-$sha-debug.apk"
          echo "built_at=$built_at"
        } >> "$GITHUB_OUTPUT"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      env:
        # Ends up in versionName, so an installed build still knows what it is.
        OH_TELLO_BUILD_LABEL: ${{ steps.name.outputs.label }}
      run: ./gradlew build

    - name: Rename the APK
      run: mv app/build/outputs/apk/debug/app-debug.apk "${{ steps.name.outputs.apk }}"

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: oh-tello-debug-apk
        path: ${{ steps.name.outputs.apk }}
        if-no-files-found: error

    # Skipped for pull requests from forks: those get a read-only token, so
    # publishing would fail the build rather than just not happening.
    - name: Publish the APK to a prerelease
      id: publish
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.ref_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        APK: ${{ steps.name.outputs.apk }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "pull_request" ]; then
          tag="pr-$PR_NUMBER"
          title="PR #$PR_NUMBER debug build"
          # The PR head, not the ephemeral merge commit: the tag has to point at
          # something that exists on the remote.
          target="$HEAD_SHA"
        else
          # Tags cannot usefully carry the slashes a branch name may have.
          tag="$(printf '%s' "$REF_NAME" | tr '/' '-')-latest"
          title="$REF_NAME debug build"
          target="$GITHUB_SHA"
        fi

        notes='Debug APK for testing on a device, replaced on every push to this
        branch. Debug-signed, so it installs without a keystore and is not
        suitable for distribution.'

        gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 || \
          gh release create "$tag" --repo "$REPO" --target "$target" --prerelease \
            --title "$title" --notes "$notes"

        # The filename carries a timestamp and commit, so each build is a new
        # asset rather than a replacement. Drop the previous ones: the release
        # should hold the current build and nothing else, so there is no way to
        # install a stale APK by picking the wrong row.
        stale=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' \
          | grep '\.apk$' | grep -v "^$APK$" || true)
        while IFS= read -r asset; do
          [ -n "$asset" ] || continue
          gh release delete-asset "$tag" "$asset" --repo "$REPO" --yes
        done <<< "$stale"

        gh release upload "$tag" "$APK" --repo "$REPO" --clobber

        echo "url=https://github.com/$REPO/releases/download/$tag/$APK" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    # One comment, edited in place on later pushes, rather than a new one per build.
    - name: Link the APK from the pull request
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        APK_URL: ${{ steps.publish.outputs.url }}
        APK: ${{ steps.name.outputs.apk }}
        BUILT_AT: ${{ steps.name.outputs.built_at }}
      run: |
        set -euo pipefail
        marker='<!-- oh-tello-apk -->'
        body=$(cat <<EOF
        $marker
        ### 📲 [$APK]($APK_URL)

        Built from \`${HEAD_SHA:0:7}\` at $BUILT_AT. Tap the link on the phone and
        Android will offer to install it — no zip to unpack, no sign-in.
        Debug-signed, so it needs no keystore of yours.

        The same string is stamped into the app version, so once installed you can
        still tell which build it is: it shows under the title on the first screen,
        and in Settings > Apps > Oh-Tello. This comment and the release asset are
        both replaced as new commits are pushed.

        ---
        _Generated by [Claude Code](https://claude.ai/code)_
        EOF
        )

        id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
          --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty" | head -n1)

        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
        fi

    - name: Upload reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: reports
        path: |
          app/build/reports/
          app/build/test-results/
        if-no-files-found: ignore
