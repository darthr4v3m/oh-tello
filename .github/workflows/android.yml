# GitHub's "Android CI" starter workflow, with four changes:
#   - JDK 17 rather than the template's 11, which AGP 8.x refuses to run on.
#   - The debug APK uploaded as an artifact, so a build can be sideloaded onto a
#     phone without a local Android SDK. Debug is signed with the standard debug
#     keystore, so it installs; the release variant is unsigned and will not.
#   - That same APK published to a prerelease and linked from the pull request,
#     because an artifact is a login-walled zip and a release asset is a direct
#     .apk URL you can tap on the phone.
#   - Reports uploaded on failure, so a red run can be read without re-running it.
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets you build an APK from any branch on demand, from the Actions tab.
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write        # publish the APK to a prerelease
      pull-requests: write   # link it from the PR

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: oh-tello-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    # Skipped for pull requests from forks: those get a read-only token, so
    # publishing would fail the build rather than just not happening.
    - name: Publish the APK to a prerelease
      id: publish
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.ref_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "pull_request" ]; then
          tag="pr-$PR_NUMBER"
          title="PR #$PR_NUMBER debug build"
          # The PR head, not the ephemeral merge commit: the tag has to point at
          # something that exists on the remote.
          target="$HEAD_SHA"
        else
          # Tags cannot usefully carry the slashes a branch name may have.
          tag="$(printf '%s' "$REF_NAME" | tr '/' '-')-latest"
          title="$REF_NAME debug build"
          target="$GITHUB_SHA"
        fi

        notes='Debug APK, replaced on every push to this branch. Debug-signed and
        unversioned — for testing on a device, not a release.'

        gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 || \
          gh release create "$tag" --repo "$REPO" --target "$target" --prerelease \
            --title "$title" --notes "$notes"
        gh release upload "$tag" app/build/outputs/apk/debug/app-debug.apk --repo "$REPO" --clobber

        echo "url=https://github.com/$REPO/releases/download/$tag/app-debug.apk" >> "$GITHUB_OUTPUT"

    # One comment, edited in place on later pushes, rather than a new one per build.
    - name: Link the APK from the pull request
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        APK_URL: ${{ steps.publish.outputs.url }}
      run: |
        set -euo pipefail
        marker='<!-- oh-tello-apk -->'
        body=$(cat <<EOF
        $marker
        ### 📲 [Download app-debug.apk]($APK_URL)

        Built from \`${HEAD_SHA:0:7}\`. Tap the link on the phone and Android will
        offer to install it — no zip to unpack, no sign-in. Debug-signed, so it
        needs no keystore of yours.

        This comment is edited in place as new commits are pushed.

        ---
        _Generated by [Claude Code](https://claude.ai/code)_
        EOF
        )

        id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
          --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty" | head -n1)

        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
        fi

    - name: Upload reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: reports
        path: |
          app/build/reports/
          app/build/test-results/
        if-no-files-found: ignore
